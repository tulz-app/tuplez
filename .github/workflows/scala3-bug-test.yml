# Regression check for a Scala 3.8+ pattern-match reachability (SpaceEngine) false positive
# triggered by tuplez's match-typed `Compose#Composed` when consumed across a compilation
# boundary. See modules/scala3-bug/... for the full explanation.
#
# This workflow is NOT generated by sbt-github-actions (which only manages ci.yml / clean.yml),
# so it is safe from `githubWorkflowGenerate`.
#
# Semantics: `tuplezScala3Bug/compile` MUST succeed. It is a regression guard.
#   * With a match-typed `Compose#Composed` (Scala 3.8+): it FAILS with E030/E121 under
#     -Werror -> RED. That red build is the reproduction of the bug.
#   * With the universal concrete-`TupleN` codegen impl (as now), structural `*:` cons types,
#     or a compiler fix for the SpaceEngine: it compiles clean -> GREEN.
# The module is not aggregated by root and not published, so it never affects the normal build.
name: scala3-bug regression check

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['**']
    tags: [v*]
  workflow_dispatch:

jobs:
  compile-reproduction:
    name: tuplezScala3Bug must compile (red if match-typed Composed returns)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Compile the reproduction module
        run: sbt 'tuplezScala3Bug/compile'
